# Защитные заголовки для страниц фронтенда (у ответов /api свои, их ставит Spring Security).
# CSP: скрипты, стили, шрифты и запросы — только с нашего адреса (шрифты лежат в src/assets/fonts).
# Картинки — ещё из data: и blob: (так браузер показывает выбранный файл до загрузки). В рамку нас не вставить
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
