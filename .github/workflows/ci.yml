# GitHub Actions: при каждом push и pull request собираем проект и запускаем тесты
name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Бэкенд — тесты
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Testcontainers сам запустит PostgreSQL, Redis и MinIO: Docker на GitHub уже есть
      - run: sh ./mvnw -B test

  frontend:
    name: Фронтенд — проверка, тесты, сборка
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  worker:
    name: Worker (Cloudflare) — проверка типов, тесты, пробная сборка
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            worker/package-lock.json
      # Worker отдаёт собранный фронтенд, поэтому сначала собираем его
      - run: npm ci && npm run build
        working-directory: frontend
      - run: npm ci
        working-directory: worker
      - run: npm run typecheck
        working-directory: worker
      # Тесты запускают Worker на настоящем движке Cloudflare (Miniflare) с временной базой D1 и R2
      - run: npm test
        working-directory: worker
      # Пробная сборка без выкладки: проверяет wrangler.jsonc и что код собирается
      - run: npx wrangler deploy --dry-run --outdir dist
        working-directory: worker

  docker:
    name: Docker — сборка и запуск (старая Java-версия)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker compose --profile app up -d --build
      # Ждём, пока сервер ответит через nginx (до минуты)
      - run: curl -fsS --retry 30 --retry-delay 2 --retry-all-errors http://localhost:8088/api/health
      - run: curl -fsS http://localhost:8088/ | grep -q 'id="root"'
      - name: Логи контейнеров, если что-то упало
        if: failure()
        run: docker compose --profile app logs
