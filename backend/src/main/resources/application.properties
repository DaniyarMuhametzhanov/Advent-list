spring.application.name=backend

spring.datasource.url=jdbc:postgresql://localhost:5434/advent
spring.datasource.username=advent
spring.datasource.password=advent

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Загрузка файлов: картинка до 5 МБ (весь запрос чуть больше — там ещё служебные строки)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
# Слишком большой файл Tomcat дочитает до конца и ответит 413, а не оборвёт соединение
server.tomcat.max-swallow-size=10MB

# Кэш (Redis из docker-compose.yml)
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Хранилище картинок (MinIO из docker-compose.yml)
storage.endpoint=http://localhost:9000
storage.region=us-east-1
storage.access-key=advent
storage.secret-key=advent-secret
storage.bucket=wish-images

# Версии юридических документов. Записываются вместе с согласием пользователя.
# Должны совпадать с версиями на страницах:
#   privacy -> frontend/src/legal/policy.ts (PRIVACY_VERSION)
#   terms   -> frontend/src/legal/terms.ts  (TERMS_VERSION)
# Изменили текст /privacy или /terms — поменяйте версию и там, и здесь
legal.privacy-version=0.1-draft
legal.terms-version=0.1-draft
